<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>FINAPP — Профиль</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317171a'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='15' fill='%23a0a0a6' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0e0e0f; --bg-soft:#141416; --panel:#17171a; --panel-2:#1e1e22;
  --border:#26262b; --border-2:#34343a;
  --text:#e9e9eb; --text-2:#9b9ba2; --text-3:#67676f;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
body{
  font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.55;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;
}
::selection{background:#3a3a40;color:#fff}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}

/* ---------- шапка / кнопки ---------- */
.header{position:sticky;top:0;z-index:50;background:rgba(14,14,15,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1100px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font-weight:700;font-size:18px;letter-spacing:.12em}
.logo span{color:var(--text-3)}
.header-user{display:flex;align-items:baseline;gap:10px;min-width:0}
.header-label{font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
.header-username{font-family:var(--mono);font-size:14px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 18px;border-radius:8px;
  border:1px solid var(--border-2);background:transparent;color:var(--text);font-size:14px;cursor:pointer;
  transition:background .15s,border-color .15s;user-select:none}
.btn:hover{background:var(--panel-2);border-color:var(--text-2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn-solid{background:var(--text);border-color:var(--text);color:#0e0e0f;font-weight:600}
.btn-solid:hover{background:#d6d6da;border-color:#d6d6da}
.btn-sm{padding:6px 12px;font-size:13px}

/* ---------- раскладка: контент слева, переключатель справа ---------- */
.layout{max-width:1100px;margin:0 auto;padding:28px 24px 64px;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;align-items:start}
.content{min-width:0}
.sidebar{position:sticky;top:88px;display:flex;flex-direction:column;gap:16px}
.side-block{border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:14px}
.side-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-3);margin-bottom:10px;padding:0 4px}
.side-btn{display:block;width:100%;text-align:left;background:none;border:none;border-left:2px solid transparent;
  color:var(--text-2);padding:9px 12px;border-radius:0 8px 8px 0;cursor:pointer;font-size:14px;margin-bottom:2px;transition:.15s}
.side-btn:hover{color:var(--text);background:var(--panel-2)}
.side-btn.active{color:var(--text);border-left-color:var(--text);background:var(--panel-2)}
.side-user .u-name{font-weight:600}
.side-user .u-line{font-size:13px;color:var(--text-2);margin-top:4px;word-break:break-all}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:static;order:-1}
}

/* ---------- представления ---------- */
.view-title{font-size:22px;font-weight:700;letter-spacing:-.01em}
.view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.view-head .view-title{margin:0}
#view-stats .view-title{margin-bottom:20px}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:14px}
.stat{border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:18px}
.stat-label{font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.stat-value{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.01em}

.card{border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:18px;margin-bottom:14px}
.card-title{font-size:14px;font-weight:600;margin-bottom:14px;color:var(--text-2)}

.cat-row{margin-bottom:14px}
.cat-row:last-child{margin-bottom:0}
.cat-head{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
.cat-val{font-family:var(--mono);color:var(--text-2)}
.cat-bar{height:6px;background:var(--bg-soft);border-radius:4px;overflow:hidden}
.cat-bar i{display:block;height:100%;background:linear-gradient(90deg,#3a3a40,#55555c);border-radius:4px}

/* ---------- список записей ---------- */
.list{border:1px solid var(--border);border-radius:12px;background:var(--panel);overflow:hidden}
.item{display:flex;justify-content:space-between;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border);transition:background .15s}
.item:last-child{border-bottom:none}
.item:hover{background:var(--bg-soft)}
.item-title{font-weight:600;font-size:14.5px}
.item-desc{font-size:13px;color:var(--text-2);margin-top:3px}
.item-meta{font-size:12px;color:var(--text-3);margin-top:5px}
.item-side{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.item-value{font-family:var(--mono);font-size:15px}
.item-del{background:none;border:1px solid transparent;color:var(--text-3);cursor:pointer;font-size:15px;width:24px;height:24px;line-height:1;border-radius:6px}
.item-del:hover{color:var(--text);border-color:var(--border-2)}
.empty{padding:36px;text-align:center;color:var(--text-3);font-size:14px}
.loading{color:var(--text-3);padding:24px;font-size:14px}

/* ---------- форма добавления ---------- */
.add-form{border:1px dashed var(--border-2);border-radius:12px;padding:18px;margin-bottom:16px;background:var(--bg-soft)}
.add-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:640px){.add-grid{grid-template-columns:1fr}}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.field input{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border-2);border-radius:8px;
  color:var(--text);font:inherit;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--text-2)}
.field input::placeholder{color:var(--text-3)}
.add-actions{display:flex;gap:10px;margin-top:4px}

/* ---------- прочее ---------- */
.toast{position:fixed;right:20px;bottom:20px;z-index:200;background:var(--panel-2);border:1px solid var(--border-2);
  color:var(--text);padding:12px 16px;border-radius:10px;font-size:14px;box-shadow:0 12px 32px rgba(0,0,0,.4)}
.fatal{max-width:520px;margin:60px auto;padding:32px;border:1px solid var(--border);border-radius:14px;background:var(--panel);text-align:center}
.fatal h2{font-size:18px;margin-bottom:8px}
.fatal p{color:var(--text-2);font-size:14px}
.fatal .btn{margin-top:18px}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a class="logo" href="/">FIN<span>APP</span></a>
    <div class="header-user">
      <span class="header-label">Профиль</span>
      <span class="header-username" id="headerUsername">…</span>
    </div>
  </div>
</header>

<div class="layout" id="layout">
  <main class="content" id="content">

    <!-- статистика -->
    <section class="view" id="view-stats">
      <h2 class="view-title">Статистика</h2>
      <div class="stats-grid" id="statsCards"><div class="loading">Загрузка…</div></div>
      <div class="card" id="catCard" hidden>
        <h3 class="card-title">Расходы по категориям</h3>
        <div id="catBars"></div>
      </div>
      <div class="card">
        <h3 class="card-title">Последние операции</h3>
        <div id="recentList"><div class="loading">Загрузка…</div></div>
      </div>
    </section>

    <!-- доходы -->
    <section class="view" id="view-income" hidden>
      <div class="view-head">
        <h2 class="view-title">Доходы</h2>
        <button class="btn btn-sm" id="incomeAddToggle">+ Добавить</button>
      </div>
      <form class="add-form" id="incomeForm" hidden novalidate>
        <div class="add-grid">
          <label class="field"><span>Название</span><input name="title" maxlength="100" required placeholder="Например: Зарплата"></label>
          <label class="field"><span>Сумма</span><input name="value" inputmode="decimal" required placeholder="1999"></label>
          <label class="field"><span>Статус</span><input name="status" value="active" maxlength="50"></label>
          <label class="field"><span>Описание</span><input name="description" maxlength="500" placeholder="Необязательно"></label>
        </div>
        <div class="add-actions">
          <button class="btn btn-solid btn-sm" type="submit">Сохранить</button>
          <button class="btn btn-sm" type="button" data-hide="incomeForm">Отмена</button>
        </div>
      </form>
      <div class="list" id="incomeList"><div class="loading">Загрузка…</div></div>
    </section>

    <!-- расходы -->
    <section class="view" id="view-spending" hidden>
      <div class="view-head">
        <h2 class="view-title">Расходы</h2>
        <button class="btn btn-sm" id="spendingAddToggle">+ Добавить</button>
      </div>
      <form class="add-form" id="spendingForm" hidden novalidate>
        <div class="add-grid">
          <label class="field"><span>Название</span><input name="title" maxlength="100" required placeholder="Например: Продукты"></label>
          <label class="field"><span>Сумма</span><input name="value" inputmode="decimal" required placeholder="1250"></label>
          <label class="field"><span>Категория</span><input name="category" maxlength="100" placeholder="супермаркет"></label>
          <label class="field"><span>Статус</span><input name="status" value="active" maxlength="50"></label>
          <label class="field" style="grid-column:1/-1"><span>Описание</span><input name="description" maxlength="500" placeholder="Необязательно"></label>
        </div>
        <div class="add-actions">
          <button class="btn btn-solid btn-sm" type="submit">Сохранить</button>
          <button class="btn btn-sm" type="button" data-hide="spendingForm">Отмена</button>
        </div>
      </form>
      <div class="list" id="spendingList"><div class="loading">Загрузка…</div></div>
    </section>

  </main>

  <!-- правая панель: выбор отображения -->
  <aside class="sidebar">
    <div class="side-block">
      <div class="side-label">Просмотр</div>
      <button class="side-btn active" data-view="stats">Статистика</button>
      <button class="side-btn" data-view="income">Доходы</button>
      <button class="side-btn" data-view="spending">Расходы</button>
    </div>
    <div class="side-block">
      <div class="side-label">Аккаунт</div>
      <div class="side-user" id="sideUserInfo"><div class="loading" style="padding:0">Загрузка…</div></div>
    </div>
  </aside>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';
const API = '/api/v1'; // базовый путь API (basePath из swagger)
const INDEX_URL = location.protocol === 'file:' ? 'index.html' : '/';

const state = {
  token: null, tokenType: 'Bearer',
  userId: null, user: null,
  incomes: [], spendings: [],
  view: 'stats',
};

/* ---------- утилиты ---------- */
const $ = id => document.getElementById(id);

function parseJwt(token){ // достаём payload JWT без сторонних библиотек
  try{
    const b = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    const json = decodeURIComponent(atob(b).split('').map(c =>
      '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);
  }catch{ return {}; }
}
const num    = v => typeof v === 'number' ? v : (parseFloat(String(v).replace(',', '.')) || 0);
const byDate = (a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0);
const esc    = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtNum = n => new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 }).format(n);
function fmtDate(iso){
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? String(iso) : d.toLocaleDateString('ru-RU', { day:'2-digit', month:'short', year:'numeric' });
}
let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
}

/* ---------- http ---------- */
function authHeaders(extra = {}){
  const h = { 'Content-Type': 'application/json', ...extra };
  if (state.token) h['Authorization'] = `${state.tokenType} ${state.token}`.trim();
  return h;
}
/* запрос с авто-обновлением access-токена через refresh-cookie при 401 */
async function apiFetch(url, opts = {}){
  const doReq = () => fetch(url, { ...opts, headers: authHeaders(opts.headers) });
  let res = await doReq();
  if (res.status === 401){
    const r = await fetch(`${API}/auth/refresh/`, { method:'POST' });
    if (!r.ok){ location.replace(INDEX_URL); throw new Error('unauthorized'); }
    const d = await r.json().catch(() => ({}));
    if (d.access_token){
      state.token = d.access_token;
      if (d.token_type) state.tokenType = d.token_type;
      res = await doReq();
    }
  }
  return res;
}
async function safeJson(res){
  if (!res.ok){ toast(`Ошибка загрузки данных (${res.status})`); return []; }
  return res.json().catch(() => []);
}
function normalizeList(d){ // API может вернуть массив или объект-обёртку
  if (Array.isArray(d)) return d;
  if (d && typeof d === 'object'){
    for (const k of ['items','results','data','list']) if (Array.isArray(d[k])) return d[k];
    if (d.id != null) return [d];
  }
  return [];
}

/* ---------- инициализация ---------- */
async function init(){
  try{
    const res = await fetch(`${API}/auth/refresh/`, { method:'POST' });
    if (!res.ok){ location.replace(INDEX_URL); return; } // нет валидной cookie — на главную
    const data = await res.json().catch(() => ({}));
    state.token = data.access_token || null;
    if (data.token_type) state.tokenType = data.token_type;

    const claims = parseJwt(state.token || '');
    state.userId = Number(claims.user_id ?? claims.id ?? claims.sub) || null;
    if (!state.userId){ location.replace(INDEX_URL); return; }

    await loadData();
  }catch(e){
    if (e && e.message === 'unauthorized') return;
    fatal('Не удалось связаться с сервером API. Проверьте, что бэкенд запущен.');
  }
}

async function loadData(){
  try{
    const [uRes, iRes, sRes] = await Promise.all([
      apiFetch(`${API}/users/${state.userId}`),
      apiFetch(`${API}/income/?user_id=${state.userId}`),
      apiFetch(`${API}/spending/?user_id=${state.userId}`),
    ]);
    if (uRes.ok) state.user = await uRes.json().catch(() => null);
    state.incomes   = normalizeList(await safeJson(iRes)).sort(byDate);
    state.spendings = normalizeList(await safeJson(sRes)).sort(byDate);
  }catch(e){ toast('Не удалось загрузить данные'); }
  renderUser();
  renderAll();
}

function fatal(msg){
  const layout = $('layout');
  layout.style.display = 'block';
  layout.innerHTML = `
    <div class="fatal">
      <h2>Проблема с подключением</h2>
      <p>${esc(msg)}</p>
      <a class="btn" href="${INDEX_URL}">Вернуться на главную</a>
    </div>`;
}

/* ---------- рендер ---------- */
function renderUser(){
  const u = state.user || {};
  const name = u.username || 'Пользователь';
  $('headerUsername').textContent = name;
  $('sideUserInfo').innerHTML = `
    <div class="u-name">${esc(name)}</div>
    ${u.email       ? `<div class="u-line">${esc(u.email)}</div>` : ''}
    ${u.phoneNumber ? `<div class="u-line">${esc(u.phoneNumber)}</div>` : ''}
    <div class="u-line">ID: ${esc(state.userId)}</div>
    ${u.createdAt   ? `<div class="u-line">С нами с ${esc(fmtDate(u.createdAt))}</div>` : ''}`;
}

const stat = (label, value) => `
  <div class="stat">
    <div class="stat-label">${esc(label)}</div>
    <div class="stat-value">${esc(value)}</div>
  </div>`;

function renderStats(){
  const inc = state.incomes.reduce((s, x) => s + num(x.value), 0);
  const sp  = state.spendings.reduce((s, x) => s + num(x.value), 0);
  $('statsCards').innerHTML = [
    stat('Доходы всего',   fmtNum(inc)),
    stat('Расходы всего',  fmtNum(sp)),
    stat('Баланс',         fmtNum(inc - sp)),
    stat('Операций',       String(state.incomes.length + state.spendings.length)),
    stat('Средний доход',  fmtNum(state.incomes.length   ? inc / state.incomes.length   : 0)),
    stat('Средний расход', fmtNum(state.spendings.length ? sp  / state.spendings.length : 0)),
  ].join('');

  /* расходы по категориям */
  const byCat = {};
  state.spendings.forEach(x => {
    const c = (x.category && String(x.category).trim()) || 'Без категории';
    byCat[c] = (byCat[c] || 0) + num(x.value);
  });
  const rows = Object.entries(byCat).sort((a, b) => b[1] - a[1]).slice(0, 6);
  if (rows.length){
    $('catCard').hidden = false;
    const max = rows[0][1] || 1;
    $('catBars').innerHTML = rows.map(([c, v]) => `
      <div class="cat-row">
        <div class="cat-head"><span>${esc(c)}</span><span class="cat-val">${fmtNum(v)}</span></div>
        <div class="cat-bar"><i style="width:${Math.max(4, Math.round(v / max * 100))}%"></i></div>
      </div>`).join('');
  } else {
    $('catCard').hidden = true;
  }

  /* последние операции */
  const merged = [
    ...state.incomes.map(x => ({ ...x, _kind: 'income' })),
    ...state.spendings.map(x => ({ ...x, _kind: 'spending' })),
  ].sort(byDate).slice(0, 6);
  $('recentList').innerHTML = merged.length
    ? merged.map(x => itemHTML(x, x._kind, { del: false })).join('')
    : `<div class="empty">Пока нет операций</div>`;
}

function itemHTML(x, kind, opts = {}){
  const del = opts.del !== false;
  const val = num(x.value);
  const sign = kind === 'income' ? '+' : '−';
  return `<div class="item">
    <div class="item-main">
      <div class="item-title">${esc(x.title || 'Без названия')}</div>
      ${x.description ? `<div class="item-desc">${esc(x.description)}</div>` : ''}
      <div class="item-meta">${esc(fmtDate(x.created_at))}${x.category ? ' · ' + esc(x.category) : ''}${x.status ? ' · ' + esc(x.status) : ''} · id ${esc(x.id)}</div>
    </div>
    <div class="item-side">
      <div class="item-value">${sign} ${fmtNum(val)}</div>
      ${del ? `<button class="item-del" data-del="${kind}" data-id="${esc(x.id)}" title="Удалить">×</button>` : ''}
    </div>
  </div>`;
}

function renderList(el, items, kind){
  el.innerHTML = items.length
    ? items.map(x => itemHTML(x, kind)).join('')
    : `<div class="empty">Пока нет записей — нажмите «+ Добавить».</div>`;
}

function renderAll(){
  renderStats();
  renderList($('incomeList'),   state.incomes,   'income');
  renderList($('spendingList'), state.spendings, 'spending');
}

/* ---------- переключение раздела (правая панель) ---------- */
document.querySelector('.sidebar').addEventListener('click', e => {
  const b = e.target.closest('[data-view]');
  if (!b) return;
  state.view = b.dataset.view;
  document.querySelectorAll('.side-btn').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('.view').forEach(v => { v.hidden = v.id !== 'view-' + state.view; });
});

/* ---------- удаление записи ---------- */
 $('content').addEventListener('click', async e => {
  const btn = e.target.closest('[data-del]');
  if (!btn) return;
  const kind = btn.dataset.del;   // income | spending
  const id   = btn.dataset.id;
  if (!confirm('Удалить эту запись?')) return;
  btn.disabled = true;
  try{
    const res = await apiFetch(`${API}/${kind}/${id}`, { method: 'DELETE' });
    if (res.ok || res.status === 204){
      if (kind === 'income') state.incomes   = state.incomes.filter(x => String(x.id) !== String(id));
      else                   state.spendings = state.spendings.filter(x => String(x.id) !== String(id));
      renderAll();
      toast('Запись удалена');
    } else {
      const err = await res.json().catch(() => ({}));
      toast(err.message || err.error || `Не удалось удалить (${res.status})`);
      btn.disabled = false;
    }
  }catch{ toast('Ошибка сети'); btn.disabled = false; }
});

/* ---------- добавление записи ---------- */
function toggleForm(id){
  const f = $(id);
  f.hidden = !f.hidden;
  if (!f.hidden) f.querySelector('input[name="title"]').focus();
}
 $('incomeAddToggle').addEventListener('click', () => toggleForm('incomeForm'));
 $('spendingAddToggle').addEventListener('click', () => toggleForm('spendingForm'));
document.querySelectorAll('[data-hide]').forEach(b =>
  b.addEventListener('click', () => { $(b.dataset.hide).hidden = true; }));

async function handleAdd(kind, e){
  e.preventDefault();
  const f = e.target;
  const btn = f.querySelector('[type="submit"]');
  const payload = {
    user_id:     state.userId,
    title:       f.title.value.trim(),
    value:       f.value.value.trim().replace(',', '.'),
    status:      f.status.value.trim() || 'active',
    description: f.description.value.trim(),
  };
  if (kind === 'spending') payload.category = f.category.value.trim();

  if (!payload.title) return toast('Укажите название');
  if (!/^\d+(\.\d{1,10})?$/.test(payload.value)) return toast('Укажите корректную сумму');

  btn.disabled = true;
  try{
    const res = await apiFetch(`${API}/${kind}/`, { method:'POST', body: JSON.stringify(payload) });
    if (res.ok){
      const created = await res.json().catch(() => null);
      const arr = kind === 'income' ? state.incomes : state.spendings;
      arr.push(created && created.id != null ? created : { ...payload, id: Date.now() });
      arr.sort(byDate);
      f.reset();
      if (f.status) f.status.value = 'active';
      f.hidden = true;
      renderAll();
      toast('Запись добавлена');
    } else {
      const err = await res.json().catch(() => ({}));
      toast(err.message || err.error || `Не удалось добавить (${res.status})`);
    }
  }catch{ toast('Ошибка сети'); }
  finally{ btn.disabled = false; }
}
 $('incomeForm').addEventListener('submit', e => handleAdd('income', e));
 $('spendingForm').addEventListener('submit', e => handleAdd('spending', e));

init();
})();
</script>
</body>
</html>
